[package]
name = "dottie"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
aomi-sdk.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
schemars = "1.2"
bs58 = "0.5"
base64 = "0.22"

[dev-dependencies]
toml = "0.9"
regex = "1"
