name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  deploy-aomi:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [app, trace]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: aomi-dottie-staging
      cancel-in-progress: false
    environment:
      name: aomi-staging
      url: https://build-staging.aomi.dev/deployments/1674
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy and activate Dottie on Aomi Build
        env:
          AOMI_BACKEND_URL: https://api-staging.aomi.dev
          AOMI_PROJECT_ID: '1674'
          AOMI_APPLICATION_ID: '2937820'
          AOMI_DEPLOY_TOKEN: ${{ secrets.AOMI_DEPLOY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy-aomi.mjs
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  web:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm build:web
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/*.test.mjs
  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [app, web, trace]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://dottie.aomi.dev
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      VITE_DOTTIE_APPLICATION_ID: '2937820'
      VITE_PRIVY_APP_ID: ${{ vars.VITE_PRIVY_APP_ID }}
      VITE_PARA_API_KEY: ${{ vars.VITE_PARA_API_KEY }}
      VITE_PARA_ENVIRONMENT: ${{ vars.VITE_PARA_ENVIRONMENT }}
      CLOUDFLARE_ACCOUNT_ID: 210e3092c7936592ca2078b5e26f7ea2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$VITE_PRIVY_APP_ID" || -z "$VITE_PARA_API_KEY" || ! "$VITE_PARA_ENVIRONMENT" =~ ^(PROD|BETA)$ ]]; then
            echo '::error::Set the public VITE_PRIVY_APP_ID, VITE_PARA_API_KEY and VITE_PARA_ENVIRONMENT repository variables to match the target portal.'
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Set the CLOUDFLARE_API_TOKEN repository or production environment secret (Cloudflare Pages Edit on the Dottie account).'
            exit 1
          fi
          bash scripts/deploy-pages.sh
      - name: Verify public site
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors https://dottie.aomi.dev/ --output /dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors https://dottie.aomi.dev/app/ --output /dev/null
