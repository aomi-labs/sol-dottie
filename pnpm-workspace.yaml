    dependencies:
      "@getpara/shared": "1.14.0"
  "@getpara/react-sdk-lite@2.19.0":
    dependencies:
      "@getpara/shared": "1.14.0"
  "@getpara/wagmi-v2-connector@2.19.0":
    dependencies:
      eventemitter3: "5.0.1"
