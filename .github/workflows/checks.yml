name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  deploy-aomi:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [app, trace]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: aomi-dottie-staging
      cancel-in-progress: false
    environment:
      name: aomi-staging
      url: https://build-staging.aomi.dev/deployments/1671
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy and activate Dottie on Aomi Build
        env:
          AOMI_BACKEND_URL: https://api-staging.aomi.dev
          AOMI_PROJECT_ID: '1671'
          AOMI_APPLICATION_ID: '2937818'
          AOMI_DEPLOY_TOKEN: ${{ secrets.AOMI_DEPLOY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy-aomi.mjs
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  web:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm build:web
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/*.test.mjs
