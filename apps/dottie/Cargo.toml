[package]
name = "dottie"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
aomi-sdk.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
schemars = "1.2"
bs58 = "0.5"
sha2 = "0.10"
curve25519-dalek = { version = "4", default-features = false }
base64 = "0.22"
ttf-parser = "0.25"
resvg = { version = "0.48", default-features = false, features = ["text", "raster-images"] }

[dev-dependencies]
toml = "0.9"
regex = "1"
